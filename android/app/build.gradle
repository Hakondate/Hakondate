plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def dartEnvironmentVariables = [:]
if (project.hasProperty('dart-defines')) {
    dartEnvironmentVariables = dartEnvironmentVariables + project.property('dart-defines')
            .split(',')
            .collectEntries { entry ->
                def pair = new String(entry.decodeBase64(), 'UTF-8').split('=')
                [(pair.first()): pair.last()]
            }
}

def resolvedFlavor = dartEnvironmentVariables.FLAVOR ?: 'dev'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

task selectGoogleServicesJson {
    doLast {
        def sourceFile = file("src/firebase/${resolvedFlavor}/google-services.json")
        def destinationFile = file('./google-services.json')
        destinationFile.text = sourceFile.text
        destinationFile.setReadable(true, false)
        destinationFile.setWritable(true, false)
    }
}

afterEvaluate {
    tasks.matching { task -> task.name == 'processDebugGoogleServices' || task.name == 'processReleaseGoogleServices' }.configureEach {
        dependsOn selectGoogleServicesJson
    }
}

android {
    namespace 'org.hakondate'
    compileSdkVersion 35

    packagingOptions {
        jniLibs {
            // AGP 8.2.1 + 16 KB page-size emulator can reject uncompressed native libs.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "org.hakondate"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        if (resolvedFlavor != 'prod') {
            applicationIdSuffix ".${resolvedFlavor}"
        }
        resValue "string", "app_name", "はこんだて" +
                (resolvedFlavor == 'prod' ? '' : ".${resolvedFlavor}")
    }
    
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            if (resolvedFlavor == 'prod') {
                signingConfig signingConfigs.release
            } else {
                // TODO: Add your own signing config for the non-prod release build.
                // Signing with the debug keys for now, so `flutter run --release` works.
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source '../..'
}

def kotlin_version = '2.1.0'
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
